backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Created portfolio item: {{slug}}"
    update: "Updated portfolio item: {{slug}}"
    delete: "Deleted portfolio item: {{slug}}"
    uploadMedia: "Uploaded media: {{path}}"
    deleteMedia: "Deleted media: {{path}}"

media_folder: "static/img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "portfolio"
    label: "Portfolio Items"
    label_singular: "Portfolio Item"
    folder: "data/portfolio"
    create: true
    extension: json
    format: json
    identifier_field: title
    summary: "{{title}} - {{category}}"
    editor:
        preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", pattern: [".{3,}", "Must have at least 3 characters"] }
      - { label: "Category", name: "category", widget: "select", options: ["Packaging", "Logo", "Poster", "Digital"] }
      - { label: "Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: ["image"] }
      - { label: "Featured Image", name: "image", widget: "image", allow_multiple: false, choose_url: false }
      - { label: "Project Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", allow_add: true, field: { label: "Tag", name: "tag", widget: "string" } }
      - { label: "Client", name: "client", widget: "string", required: false }
      - { label: "Project URL", name: "url", widget: "string", required: false, pattern: ["^(http|https)://.*", "Must be a valid URL"] }
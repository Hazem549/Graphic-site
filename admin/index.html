<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Doe CMS</title>
    
    <!-- Load CMS from alternative CDN -->
    <script src="https://unpkg.com/netlify-cms@^2.10.0/dist/netlify-cms.js"></script>
    
    <!-- Loading status and error handling -->
    <style>
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-family: sans-serif;
        }
        
        #error {
            display: none;
            color: red;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>Loading CMS...</h2>
        <div class="spinner"></div>
    </div>
    
    <div id="error"></div>

    <script>
        // Error handling
        window.addEventListener('load', function() {
            setTimeout(function() {
                if (!document.querySelector('.nc-root')) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').innerHTML = `
                        <h3>CMS Failed to Load</h3>
                        <p>Possible issues:</p>
                        <ul>
                            <li>Check network connection</li>
                            <li>Disable ad blockers</li>
                            <li>Verify Netlify Identity setup</li>
                            <li>Check browser console for errors</li>
                        </ul>
                    `;
                }
            }, 3000);
        });

        // Initialize CMS with error catching
        try {
            CMS.registerPreviewStyle("../css/styles.css");
            CMS.registerPreviewTemplate("portfolio", ({ entry }) => {
                const data = entry.getIn(['data']).toJS();
                return `
                    <div style="padding: 20px;">
                        <h2>${data.title}</h2>
                        <img src="${data.image}" style="max-width: 200px;">
                        <p>${data.description || ''}</p>
                    </div>
                `;
            });
        } catch (error) {
            console.error('CMS Initialization Error:', error);
            document.getElementById('error').innerHTML = `
                CMS Error: ${error.message}
                <br>Check console for details
            `;
        }
    </script>
</body>
</html>
